<!doctype html>
<html><head><meta charset="utf-8"><title>NDR EdTech - Snowflake Day 1</title>
<style>html,body{margin:0;background:#030407}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,DUR=80.4;
const C={bk:'#030407',bl:'#1558C9',li:'#D4FF24',wh:'#FFFFFF',gr:'#A9B0BE'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const IMG={};
const imgList={logo:'assets/ndredtech_logo.png',aws:'assets/Amazon-Web-Services-AWS-Logo.png',azure:'assets/azure-cloud-logo.png',gcp:'assets/google-cloud.jpg'};
window.ready=Promise.all(Object.entries(imgList).map(([k,s])=>new Promise(r=>{const i=new Image();i.onload=()=>{IMG[k]=i;r()};i.src=s;}))).then(()=>document.fonts.ready);

/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const ebo=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mul(11);
const HF='"Segoe UI Black","Segoe UI",Arial', SF='"Segoe UI Semibold","Segoe UI",Arial', MF='Consolas,"Courier New",monospace';
function txt(s,x,y,size,col,o={}){
  ctx.save();ctx.font=`${size}px ${o.f||HF}`;ctx.fillStyle=col;ctx.textAlign=o.al||'center';ctx.textBaseline='middle';
  ctx.letterSpacing=(o.ls||0)+'px';if(o.a!=null)ctx.globalAlpha*=o.a;
  if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=o.gb||24}
  ctx.fillText(s,x,y);ctx.restore();
}
function kin(segs,cx,y,size,u,t0,o={}){ // segs: [[text,color],...] per-letter reveal
  const full=segs.map(s=>s[0]).join('');
  ctx.save();ctx.font=`${size}px ${o.f||HF}`;ctx.letterSpacing=(o.ls||0)+'px';ctx.textBaseline='middle';ctx.textAlign='left';
  const tw=ctx.measureText(full).width;let x0=cx-tw/2,i=0;
  for(const [s,col] of segs){for(const ch of s){
    const p=ebo(P(u,t0+i*0.035,t0+i*0.035+0.5));
    const px=x0+ctx.measureText(full.slice(0,i)).width;
    ctx.globalAlpha=clamp(p*1.4)*(o.a==null?1:o.a);ctx.fillStyle=col;
    if(o.glow&&col===C.li){ctx.shadowColor=C.li;ctx.shadowBlur=26}else ctx.shadowBlur=0;
    ctx.fillText(ch,px,y+(1-p)*50);i++;}}
  ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function box(x,y,w,h,r,fill,stroke,lw=3,glow){ctx.save();rr(x,y,w,h,r);if(glow){ctx.shadowColor=glow;ctx.shadowBlur=30}
  if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}ctx.restore()}
function pill(cx,cy,s,size,fill,tc,stroke,o={}){ctx.save();ctx.font=`${size}px ${o.f||SF}`;ctx.letterSpacing=(o.ls||4)+'px';
  const w=ctx.measureText(s).width+size*1.6,h=size*1.9;ctx.restore();
  box(cx-w/2,cy-h/2,w,h,h/2,fill,stroke,3,o.glow);txt(s,cx,cy+1,size,tc,{f:o.f||SF,ls:o.ls||4})}
function line(pts,col,lw=3,dash){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;if(dash)ctx.setLineDash(dash);ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore()}
function dot(x,y,r,col,glow){ctx.save();ctx.fillStyle=col;if(glow){ctx.shadowColor=glow;ctx.shadowBlur=r*4}ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.restore()}
function polyAt(pts,f){let L=[],tot=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);L.push(d);tot+=d}
  let d=f*tot;for(let i=0;i<L.length;i++){if(d<=L[i]||i==L.length-1){const k=clamp(d/L[i]);return[pts[i][0]+(pts[i+1][0]-pts[i][0])*k,pts[i][1]+(pts[i+1][1]-pts[i][1])*k]}d-=L[i]}}
function flow(pts,t,n,speed,col,size=6,al=1,trail=true){
  for(let i=0;i<n;i++){const f=((t*speed+i/n)%1+1)%1;
    if(trail)for(let k=3;k>=1;k--){const q=polyAt(pts,clamp(f-k*0.012));ctx.globalAlpha*=al*(0.18*(4-k)/3);dot(q[0],q[1],size*(1-k*.18),col);ctx.globalAlpha/=al*(0.18*(4-k)/3)}
    const p=polyAt(pts,f);const e=Math.min(1,f*8,(1-f)*8);ctx.save();ctx.globalAlpha*=al*e;dot(p[0],p[1],size,col,col);ctx.restore()}}
function quad(p0,p1,p2,n=24){const o=[];for(let i=0;i<=n;i++){const t=i/n;o.push([(1-t)*(1-t)*p0[0]+2*(1-t)*t*p1[0]+t*t*p2[0],(1-t)*(1-t)*p0[1]+2*(1-t)*t*p1[1]+t*t*p2[1]])}return o}
function cyl(cx,y,w,h,o={}){const x=cx-w/2,ry=w*.2;ctx.save();
  const body=()=>{ctx.beginPath();ctx.moveTo(x,y+ry);ctx.lineTo(x,y+h-ry);ctx.ellipse(cx,y+h-ry,w/2,ry,0,Math.PI,0,true);ctx.lineTo(x+w,y+ry);ctx.ellipse(cx,y+ry,w/2,ry,0,0,Math.PI,true);ctx.closePath()};
  if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=28}
  body();ctx.fillStyle=o.fill||rgba(C.bl,.55);ctx.fill();ctx.shadowBlur=0;
  if(o.level>0){ctx.save();body();ctx.clip();ctx.fillStyle=rgba(C.li,.75);const ly=y+h-ry-(h-2*ry)*o.level;ctx.fillRect(x,ly,w,h);ctx.restore()}
  body();ctx.strokeStyle=o.stroke||C.bl;ctx.lineWidth=o.lw||3;ctx.stroke();
  ctx.beginPath();ctx.ellipse(cx,y+ry,w/2,ry,0,0,7);ctx.fillStyle=o.top||rgba(C.wh,.16);ctx.fill();ctx.strokeStyle=o.stroke||C.bl;ctx.stroke();
  for(let k=1;k<=2;k++){ctx.beginPath();ctx.ellipse(cx,y+ry+(h-2*ry)*k/3,w/2,ry,0,0,Math.PI);ctx.strokeStyle=rgba(C.wh,.14);ctx.lineWidth=2;ctx.stroke()}
  ctx.restore()}
function cloudShape(cx,cy,w,grow=0){const s=w/126;ctx.beginPath();
  [[-30,10,24],[-8,-8,30],[22,-2,26],[40,12,19],[-48,18,15]].forEach(([a,b,r])=>{ctx.moveTo(cx+(a+r+grow)*s,cy+b*s);ctx.arc(cx+a*s,cy+b*s,(r+grow)*s,0,7)});
  ctx.roundRect(cx-62*s-grow*s,cy+6*s,118*s+2*grow*s,28*s+grow*s,14*s)}
function cloud(cx,cy,w,t=0){ctx.save();
  ctx.shadowColor=C.bl;ctx.shadowBlur=70;cloudShape(cx,cy,w,2.5);ctx.fillStyle=C.li;ctx.fill();ctx.shadowBlur=0;
  cloudShape(cx,cy+w*.03,w,0);ctx.fillStyle=rgba(C.bl,1);ctx.fill();
  ctx.save();cloudShape(cx,cy,w,0);ctx.clip();ctx.fillStyle=rgba(C.wh,.14);ctx.beginPath();ctx.ellipse(cx-w*.1,cy-w*.12,w*.32,w*.14,-.2,0,7);ctx.fill();
  ctx.fillStyle=rgba(C.bk,.28);ctx.fillRect(cx-w,cy+w*.12,w*2,w);ctx.restore();ctx.restore()}
function flake(cx,cy,r,col,lw=4,rot=0){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.shadowColor=col;ctx.shadowBlur=r*.5;
  for(let k=0;k<6;k++){ctx.save();ctx.rotate(k*Math.PI/3);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(r,0);
    [.45,.72].forEach((f,j)=>{const L=r*(j?.2:.3);ctx.moveTo(r*f,0);ctx.lineTo(r*f+L*.7,L*.7);ctx.moveTo(r*f,0);ctx.lineTo(r*f+L*.7,-L*.7)});ctx.stroke();ctx.restore()}ctx.restore()}
function fit(img,x,y,w,h){const k=Math.min(w/img.width,h/img.height),dw=img.width*k,dh=img.height*k;ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}
function logoCard(cx,cy,s,t){ctx.save();ctx.translate(cx,cy);ctx.shadowColor=C.bl;ctx.shadowBlur=80;box(-s/2,-s/2,s,s,s*.11,C.wh);ctx.shadowBlur=0;
  rr(-s/2,-s/2,s,s,s*.11);ctx.clip();ctx.drawImage(IMG.logo,-s/2,-s/2,s,s);
  if(t!=null){const p=P(t,0,1);ctx.fillStyle=rgba(C.li,.35);ctx.save();ctx.rotate(.5);ctx.fillRect(-s+p*s*2.4-s*.6,-s,s*.12,s*2);ctx.restore()}ctx.restore()}
function sec(t,a,b,fn,o={}){if(t<a||t>b+.001)return;const f=o.f||.35;const al=Math.min(P(t,a,a+f),o.out===false?1:1-P(t,b-f,b));
  ctx.save();ctx.globalAlpha*=al;fn(t-a,al);ctx.restore()}
function fmt(n){return Math.floor(n).toLocaleString('en-US')}

/* ---------- background ---------- */
const PART=Array.from({length:120},()=>({x:R()*W,y:R()*H,vx:(R()-.5)*12,vy:-(6+R()*34),s:1+R()*3,l:R()<.14,ph:R()*6.3}));
function bg(t){
  ctx.fillStyle=C.bk;ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(540,700,50,540,700,1100);g.addColorStop(0,rgba(C.bl,.20));g.addColorStop(1,rgba(C.bl,0));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=rgba(C.bl,.07);ctx.lineWidth=1;ctx.beginPath();
  const off=(t*14)%60;for(let x=0;x<=W;x+=60){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=-60+off;y<=H;y+=60){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
  for(const p of PART){const x=((p.x+p.vx*t)%W+W)%W,y=((p.y+p.vy*t)%H+H)%H;ctx.globalAlpha=.25+.25*Math.sin(t*2+p.ph);dot(x,y,p.s,p.l?C.li:C.bl,p.l?C.li:null)}ctx.globalAlpha=1;
}

/* ---------- SCENE 1 : brand intro (0 - 6.8) ---------- */
const S1P=Array.from({length:140},()=>({a:R()*6.28,d:350+R()*900,s:1+R()*3,l:R()<.2,dl:R()*.6}));
function scene1(u){
  const gA=P(u,.2,1.2)*.9;
  // perspective floor
  ctx.save();ctx.globalAlpha*=gA*.7;ctx.strokeStyle=rgba(C.bl,.6);ctx.lineWidth=2;ctx.beginPath();
  for(let i=-14;i<=14;i++){ctx.moveTo(540+i*34,1180);ctx.lineTo(540+i*240,1920)}
  for(let k=0;k<14;k++){const f=(k+(u*.8)%1)/14,y=1180+Math.pow(f,2.1)*740;ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();ctx.restore();
  // data streams
  for(let i=0;i<9;i++){const y=140+i*195+(i%2)*40,sp=.25+.07*i,dir=i%2?1:-1,a=P(u,.3+i*.08,1)*.8;
    ctx.save();ctx.globalAlpha*=a;line([[0,y],[W,y]],rgba(C.bl,.25),2);
    for(let k=0;k<4;k++){const f=((u*sp*dir+k/4+i*.13)%1+1)%1,x=f*(W+300)-150;const lime=(k+i)%4===0;
      ctx.fillStyle=lime?C.li:C.bl;ctx.shadowColor=lime?C.li:C.bl;ctx.shadowBlur=14;ctx.fillRect(x,y-3,lime?90:140,6)}ctx.restore()}
  // converging particles
  for(const p of S1P){const k=eio(P(u,p.dl,1.3)),d=p.d*(1-k),x=540+Math.cos(p.a)*d,y=720+Math.sin(p.a)*d;
    const al=P(u,0,.3)*(1-P(u,1.2,1.8));if(al>0){ctx.globalAlpha=al;dot(x,y,p.s,p.l?C.li:C.bl,p.l?C.li:C.bl);ctx.globalAlpha=1}}
  // logo reveal
  const lp=P(u,.9,1.9);if(lp>0){const s=ebo(lp);
    ctx.save();ctx.globalAlpha*=eo(lp);
    for(let r=0;r<2;r++){const rp=P(u,.9+r*.25,2.1+r*.25);ctx.strokeStyle=rgba(C.li,(1-rp)*.9);ctx.lineWidth=5;ctx.beginPath();ctx.arc(540,720,250+rp*420,0,7);ctx.stroke()}
    ctx.translate(540,720);ctx.scale(.55+.45*s,.55+.45*s);ctx.translate(-540,-720);logoCard(540,720,500,P(u,1.7,2.6));ctx.restore()}
  kin([['NDR ',C.wh],['EdTech',C.li]],540,1085,104,u,1.4,{glow:1});
  if(u>2.2){const p=eo(P(u,2.3,3));txt('DATA ENGINEERING SERIES',540,1190+(1-p)*20,38,C.gr,{f:SF,ls:9,a:p});
    ctx.save();ctx.globalAlpha*=p;line([[540-120*p,1235],[540+120*p,1235]],C.li,3);ctx.restore()}
  if(u>4.3){const p=ebo(P(u,4.4,5.1));ctx.save();ctx.translate(540,1340);ctx.scale(p,p);ctx.globalAlpha*=clamp(p);
    box(-330,-52,660,104,52,C.li,null,0,C.li);txt('30 DAYS OF SNOWFLAKE',0,3,48,C.bk,{f:HF,ls:3});ctx.restore()}
}

/* ---------- SCENE 2 : introducing Snowflake (6.8 - 11.9) ---------- */
function scene2(u){
  kin([['SNOW',C.wh],['FLAKE',C.li]],540,330,150,u,.3,{glow:1});
  const cp=ebo(P(u,.1,1));const cy=745;
  const dbs=[170,400,680,910];
  dbs.forEach((x,i)=>{const a=P(u,.4+i*.12,1);ctx.save();ctx.globalAlpha*=a;
    cyl(x,1050+(1-a)*40,110,150,{level:.3+.5*((u*.4+i*.25)%1),glow:rgba(C.bl,.8)});txt(['CRM','ERP','APPS','FILES'][i],x,1235,26,C.gr,{f:SF,ls:4});ctx.restore();
    if(u>.7){const pts=quad([x,1045],[x,930],[540+(x-540)*.3,880]);ctx.save();ctx.globalAlpha*=P(u,.7,1.2);line(pts,rgba(C.bl,.5),3);flow(pts,u+i*.2,5,.45,i%2?C.li:C.wh,5.5);ctx.restore()}});
  ctx.save();ctx.translate(540,cy);ctx.scale(.4+.6*cp,.4+.6*cp);ctx.translate(-540,-cy);ctx.globalAlpha*=clamp(cp*1.5);
  cloud(540,cy-30,640,u);flake(540,cy+5,92,C.li,6,u*.35);ctx.restore();
  if(u>3.1){const p=P(u,3.1,3.7);ctx.save();ctx.globalAlpha*=eo(p);
    txt('WHAT IS',540,1370+(1-p)*20,64,C.wh,{ls:6});txt('SNOWFLAKE?',540,1450+(1-p)*20,92,C.li,{glow:C.li});ctx.restore()}
  if(u>4){const p=ebo(P(u,4,4.6));ctx.save();ctx.translate(540,1585);ctx.scale(p,p);ctx.globalAlpha*=clamp(p);
    pill(0,0,'CLOUD-BASED DATA PLATFORM',30,rgba(C.bk,.6),C.li,C.li,{ls:5});ctx.restore()}
}

/* ---------- SCENE 3 : architecture (11.9 - 20.0) ---------- */
function s3panel(i,u,act,y,title,sub,vis){
  const tOn=[1.3,1.7,2.1][i],a=eo(P(u,tOn,tOn+.6));if(a<=0)return;
  ctx.save();ctx.globalAlpha*=a;
  const on=act>0;box(100,y,880,220,26,rgba(on?C.bl:C.bk,on?.38:.5),on?C.li:rgba(C.bl,.8),on?4:2,on?C.li:null);
  txt('0'+(i+1),130,y+48,30,C.li,{al:'left'});txt(title,130,y+100,42,C.wh,{al:'left'});txt(sub,130,y+150,24,C.gr,{al:'left',f:SF,ls:1});
  ctx.save();rr(100,y,880,220,26);ctx.clip();vis(on?act:0,y);ctx.restore();ctx.restore()}
function scene3(u){
  { const p=eo(P(u,0,.6));ctx.save();ctx.globalAlpha*=p;pill(540,255,'CLOUD-BASED DATA PLATFORM',32,rgba(C.bl,.35),C.li,C.li,{ls:5});ctx.restore()}
  // sources
  const sa=eo(P(u,.4,1));ctx.save();ctx.globalAlpha*=sa;box(60,320,960,120,22,rgba(C.bk,.6),rgba(C.bl,.9),2);
  txt('DATA SOURCES',100,345,22,C.gr,{al:'left',f:SF,ls:5});
  ['DATABASES','FILES','APPS','APIs'].forEach((s,i)=>{box(90+i*230,365,210,56,14,rgba(C.bl,.3),C.bl,2);txt(s,195+i*230,394,24,C.wh,{f:SF,ls:2})});ctx.restore();
  // container
  const ca=eo(P(u,.9,1.5));ctx.save();ctx.globalAlpha*=ca;
  box(60,520,960,840,34,rgba(C.bl,.10),C.bl,3,rgba(C.bl,.6));
  txt('SNOWFLAKE',100,570,32,C.li,{al:'left',ls:9,glow:C.li,gb:14});flake(960,568,28,C.li,3,u*.5);ctx.restore();
  if(u>1){const pts=[[540,440],[540,520]];ctx.save();ctx.globalAlpha*=P(u,1,1.6);flow(pts,u,3,.8,C.li,6);ctx.restore()}
  const a1=u>3.1&&u<4.7?1:u>=4.7?.55:0,a2=u>4.7&&u<6.1?1:u>=6.1?.55:0,a3=u>6.1?1:0;
  s3panel(0,u,a1,610,'DATA STORAGE','Millions of records',(a,y)=>{
    [570,690,810].forEach((x,k)=>cyl(x,y+55,92,140,{level:a?clamp((u-3.1)*.45+k*.08):0,glow:a?C.li:null,stroke:a?C.li:C.bl}));
    for(let r=0;r<4;r++)for(let c=0;c<3;c++){const k=r*3+c;const on=a&&((u*5+k*1.7)%6)<4.2;box(888+c*28,y+52+r*30,22,22,5,on?C.li:rgba(C.bl,.5),null)}
    if(a)flow([[500,y+30],[500,y+190]],u,4,.7,C.li,4)});
  s3panel(1,u,a2,850,'DATA PROCESSING','SQL queries on compute',(a,y)=>{
    const g=(u-4.7)*1.6;ctx.save();ctx.translate(645,y+105);ctx.rotate(a?g:0);
    ctx.strokeStyle=a?C.li:C.bl;ctx.lineWidth=14;ctx.beginPath();ctx.arc(0,0,38,0,7);ctx.stroke();
    for(let k=0;k<8;k++){ctx.save();ctx.rotate(k*Math.PI/4);ctx.fillStyle=a?C.li:C.bl;ctx.fillRect(-9,-60,18,22);ctx.restore()}ctx.restore();
    ['SELECT','JOIN','GROUP BY'].forEach((s,k)=>{const f=a?((u*.55+k/3)%1):0;const x=745+f*160;ctx.globalAlpha*=a?1:.5;
      box(x-45,y+36+k*40,90,30,8,rgba(C.li,.9),null);txt(s,x,y+51+k*40,17,C.bk,{f:MF});ctx.globalAlpha=1});
    box(715,y+170,225,12,6,rgba(C.bl,.35));if(a)box(715,y+170,225*((u*.9)%1),12,6,C.li)});
  s3panel(2,u,a3,1090,'DATA ANALYTICS','Dashboards & reports',(a,y)=>{
    [.4,.62,.5,.9,.7].forEach((h,k)=>{const hh=a?110*h*eo(P(u,6.2+k*.12,6.9+k*.12)):10;box(560+k*62,y+190-hh,42,hh,6,k==3?C.li:C.bl,null,0,k==3&&a?C.li:null)});
    ctx.strokeStyle=rgba(C.wh,.2);ctx.lineWidth=2;line([[545,y+192],[880,y+192]],rgba(C.wh,.25),2);
    ctx.beginPath();ctx.arc(915,y+105,46,0,7);ctx.strokeStyle=rgba(C.bl,.6);ctx.lineWidth=14;ctx.stroke();
    ctx.beginPath();ctx.arc(915,y+105,46,-Math.PI/2,-Math.PI/2+6.28*(a?.72*eo(P(u,6.3,7.2)):.02));ctx.strokeStyle=C.li;ctx.stroke()});
  // output
  if(u>6.2){const p=P(u,6.4,7);ctx.save();ctx.globalAlpha*=p;flow([[540,1360],[540,1440]],u,3,.8,C.li,6);ctx.restore()}
  if(u>6.5){const p=ebo(P(u,6.6,7.3));ctx.save();ctx.translate(540,1495);ctx.scale(p,Math.max(p,0));ctx.globalAlpha*=clamp(p);
    box(-480,-60,960,120,26,C.li,null,0,C.li);txt('BUSINESS INSIGHTS',0,3,50,C.bk,{ls:4});ctx.restore()}
}

/* ---------- SCENE 4 : real-time example (20.0 - 34.4) ---------- */
const TR=Array.from({length:60},(_,i)=>[1001+(i*37)%90,50000+i*7,(((i*53)%900)/10+5).toFixed(2)]);
function scene4(u){
  { const p=eo(P(u,.1,.7));ctx.save();ctx.globalAlpha*=p;pill(540,255,'REAL-WORLD EXAMPLE',32,rgba(C.li,1),C.bk,null,{ls:6});ctx.restore() }
